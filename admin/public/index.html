<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Media Library Admin</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="wrap">
    <header><div class="eyebrow">PRIVATE ADMIN</div><h1>Media Library</h1><p>Upload PDFs and videos to your public library.</p></header>
    <section class="panel" id="loginPanel">
      <h2>Admin sign in</h2>
      <label>Admin password<input id="password" type="password" autocomplete="current-password" placeholder="Enter your admin password"></label>
      <button id="loginBtn">Unlock admin</button><p class="hint">Your admin panel is available only on this computer.</p>
    </section>
    <section class="panel hidden" id="appPanel">
      <h2>Upload media</h2>
      <form id="uploadForm">
        <label>Choose PDF or video<input type="file" name="media" id="media" accept="application/pdf,video/*" required></label>
        <div class="grid">
          <label>Title<input name="title" placeholder="e.g. Python Notes"></label>
          <label>Category<input name="category" placeholder="e.g. Programming" value="General"></label>
        </div>
        <label>Description<textarea name="description" rows="3" placeholder="A short description for visitors and search engines"></textarea></label>
        <button id="uploadBtn">Upload to library</button>
        <div class="progress hidden" id="progress">Uploading… please keep this page open.</div>
      </form>
      <p id="message" role="status"></p>
      <hr>
      <div class="row"><h2>Your uploaded files</h2><button class="secondary" id="refreshBtn">Refresh</button></div>
      <div id="items" class="items"></div>
    </section>
  </main>
  <script src="/admin.js"></script>
</body></html>
